name: Platform kit

# Generated by the platform kit (source: automationpc-platform kit/platform-kit.workflow.yml). Do not edit here.
# The table rules, enforced by the machine: the work list is valid, the kit is intact, and every pull request
# names a work item. Runs on this repo's CI runner; no secrets, read-only token.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  table-rules:
    runs-on: __RUNS_ON__
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Work list is valid and the kit is intact
        shell: bash
        run: |
          set -euo pipefail
          python3 platform/kit/work_items.py check
          python3 platform/kit/roles.py check
          python3 platform/kit/test_kit.py
      - name: Every unit this repo installs passes the executor's own unit lint
        shell: bash
        run: python3 platform/kit/unit_lint_check.py .
      - name: No workflow would run on a billed GitHub-hosted runner
        shell: bash
        run: python3 platform/kit/no_hosted_runners.py .
      - name: The pull request names its work item
        if: github.event_name == 'pull_request'
        shell: bash
        run: python3 platform/kit/check_pr.py
      - name: Boundary list (reports a change that needs the owner; the list is platform/kit/boundaries.json)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 platform/kit/boundary.py check --pr || test $? -eq 3
